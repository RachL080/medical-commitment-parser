[project]
name = "commitment-form-model-layer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
gemini = ["google-genai>=1,<2"]
anthropic = ["anthropic>=0.80,<1"]
openai = ["openai>=2,<3"]
test = ["pytest>=8,<10", "pytest-mock>=3,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["model_layer*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
