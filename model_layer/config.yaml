cache_dir: .cache/model-layer
cache_enabled: true
prompt_version: "1"
schema_version: "1"
provider_models:
  gemini: ${GEMINI_MODEL}
  anthropic: ${ANTHROPIC_MODEL}
  openai: ${OPENAI_MODEL}
  local: ${LOCAL_MODEL}
allowed_referring_organizations: []
