services:
  - type: web
    name: medical-commitment-parser
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm --prefix backend run build && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_REQUEST_TIMEOUT_MS
        value: "25000"
      - key: GEMINI_ORIENTATION_TIMEOUT_MS
        value: "15000"